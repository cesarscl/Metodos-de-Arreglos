<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="asset/style.css">
</head>
<body>
  <main class="card">
    <h1>Todo List</h1>

    <section class="nueva-tarea">
      <label for="input-tarea">Nueva tarea</label>
      <div class="input-group">
        <input type="text" id="input-tarea" placeholder="Escribe una tarea...">
        <button id="btn-agregar">Agregar</button>
      </div>
    </section>

    <hr>

    <section class="contenido">
      <div class="resumen">
        <p>Total: <strong id="total-tareas">0</strong></p>
        <p>Realizadas: <strong id="total-realizadas">0</strong></p>
      </div>

      <div class="lista">
        <div class="lista-header">
          <span class="col-id">ID</span>
          <span class="col-tarea">Tarea</span>
          <span class="col-check"></span>
          <span class="col-borrar"></span>
        </div>
        <ul id="lista-tareas"></ul>
      </div>
    </section>
  </main>

  <script src="asset/script.js"></script>
</body>
</html>
